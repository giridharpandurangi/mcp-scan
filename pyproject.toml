[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-audit"
version = "0.1.0"
description = "Security scanner for Model Context Protocol (MCP) servers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "giridharpandurangi" }]
requires-python = ">=3.11"
keywords = ["security", "mcp", "scanner", "static-analysis", "ssrf", "prompt-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/giridharpandurangi/mcp-scan"
Repository = "https://github.com/giridharpandurangi/mcp-scan"
"Bug Tracker" = "https://github.com/giridharpandurangi/mcp-scan/issues"

[project.scripts]
mcp-scan = "mcp_scan.cli:app"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_scan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcp_scan"]
omit = ["tests/*"]
